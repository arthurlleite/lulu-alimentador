; Alimentador Automático de Pets — firmware ESP-IDF (FreeRTOS) via PlatformIO
;
; Placa recomendada: ESP32-S3-DevKitC-1 (N16R8 ou N8R2).
; Também compila para a ESP32 clássica (DevKit V1 / ESP32-WROOM-32).
;
;   pio run -e esp32s3            -> compila
;   pio run -e esp32s3 -t upload  -> grava
;   pio device monitor            -> serial (115200)
;   pio run -e esp32s3 -t menuconfig -> pinos, broker MQTT, fuso horário...

[platformio]
default_envs = esp32s3

[env]
platform = espressif32@6.9.0
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
board_build.embed_txtfiles =
    ../web/index.html
    ../web/configurar.html

[env:esp32s3]
board = esp32-s3-devkitc-1
; A DevKitC-1 tem duas USB-C: use a marcada "UART"/"COM" para gravar e ver o log.

[env:esp32]
board = esp32dev
